<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="理大祭レジ">
<meta name="theme-color" content="#0d6e8a">
<meta name="format-detection" content="telephone=no">
<title>理大祭 レジ</title>
<style>
:root{
  --bg:#f3f4f6; --surface:#ffffff; --ink:#1f2933; --muted:#616e7c; --line:#d5dae1;
  --accent:#1f6f4a; --accent-ink:#ffffff; --accent-soft:#e3efe8;
  --tomato:#c2410c; --sun:#f6d860;
  --good:#2f7d4f; --good-soft:#e6f2dc; --bad:#b3341f; --warn:#7a4f00; --warn-soft:#fbe9b6;
  --font:'Hiragino Maru Gothic ProN','Hiragino Sans','Yu Gothic','Noto Sans JP',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overscroll-behavior:none}
html{touch-action:manipulation;-webkit-touch-callout:none}
button,input,[data-act],[data-tab]{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button{-webkit-appearance:none;appearance:none;user-select:none;-webkit-user-select:none;font-family:inherit}
input{-webkit-appearance:none;appearance:none}
body{position:fixed;left:0;right:0;top:0;bottom:0;width:100%}
body{background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--font);-webkit-text-size-adjust:100%}
.num{font-variant-numeric:tabular-nums}
#app{display:flex;flex-direction:column;height:100%;max-width:640px;margin:0 auto}
@supports (height:100dvh){#app{height:100dvh}}
header{padding:calc(12px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left));display:flex;align-items:center;justify-content:space-between;gap:10px}
header h1{font:900 19px/1.2 var(--font);margin:0}
.chip{font-size:12px;padding:2px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent);font-weight:700;white-space:nowrap}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:4px 16px 24px}
nav{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{border:0;background:none;color:var(--muted);font:700 14px var(--font);padding:13px 4px;min-height:48px;cursor:pointer;border-top:3px solid transparent}
nav button[aria-current="true"]{color:var(--accent);border-top-color:var(--accent)}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
section{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
h2{font:700 15px var(--font);margin:0 0 8px;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:7px 14px;font:700 14px var(--font);cursor:pointer;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.start{border:0;background:var(--accent);color:var(--accent-ink);border-radius:18px;min-height:150px;font:900 28px var(--font);cursor:pointer;width:100%}
.start:active{filter:brightness(.92)}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat small{color:var(--muted)}
.stat .v{font:900 24px/1.2 var(--font)}
.stat.main{grid-column:1/-1;border-color:var(--accent)}
.stat.main .v{font-size:32px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal}
th{color:var(--muted);font-weight:500;font-size:12px}
tfoot td{font-weight:700;border-bottom:0}
.scroll{overflow-x:auto}
input{font:400 16px var(--font);padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);min-height:44px;width:100%}
.btn{border:0;background:var(--accent);color:var(--accent-ink);font:700 15px var(--font);padding:12px 16px;border-radius:10px;cursor:pointer;min-height:44px}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn.danger{background:none;color:var(--bad);padding:6px 10px;min-height:36px;font-size:13px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.log{list-style:none;margin:0;padding:0}
.log li{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.log li:last-child{border-bottom:0}
.log .main{flex:1;min-width:0}
.log .sub{color:var(--muted);font-size:12px}
.empty{color:var(--muted);text-align:center;padding:14px 0}
.note{font-size:13px;color:var(--muted)}
textarea{width:100%;min-height:140px;font:12px/1.4 monospace;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);padding:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:700;font-size:14px;z-index:30;max-width:90%}
.fs{position:fixed;top:0;left:0;right:0;bottom:0;z-index:20;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.fs-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 20px 8px;width:100%;max-width:960px;margin:0 auto}
.fs-head h3{margin:0;font:900 22px var(--font)}
.fs-body{flex:1;min-height:0;overflow-y:auto;width:100%;max-width:960px;margin:0 auto;padding:4px 20px 16px}
.fs-foot{border-top:1px solid var(--line);background:var(--surface);padding:12px 20px 14px}
.fs-foot>*{max-width:920px;margin-left:auto;margin-right:auto}
.fs-foot .total{margin-bottom:10px}
.items{display:grid;grid-template-columns:1fr;gap:0 28px}
@media (min-width:900px){.items{grid-template-columns:1fr 1fr}}
.fs-cust{background:var(--ink);color:var(--bg);justify-content:space-between}
.cu-main{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px;padding:24px;text-align:center;min-height:0}
.cu-label{font-size:clamp(20px,4vh,32px);opacity:.85}
.cu-total{font:900 clamp(72px,min(24vw,26vh),240px)/1.05 var(--font)}
.cu-lines{list-style:none;margin:8px 0 0;padding:0;font-size:clamp(20px,3.6vh,32px);display:flex;flex-direction:column;gap:6px;width:min(100%,560px);max-height:36%;overflow-y:auto}
.cu-lines li{display:flex;justify-content:space-between;gap:16px}
.cu-foot{display:flex;justify-content:space-between;gap:12px;padding:12px 20px 16px}
.cu-foot button{background:none;border:1px solid rgba(128,140,170,.6);color:inherit;opacity:.8;border-radius:12px;padding:12px 18px;font:700 15px var(--font);cursor:pointer;min-height:48px}
.sum2{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;padding:10px 0 12px;border-bottom:1px solid var(--line);margin-bottom:10px}
.sum2 small{display:block;color:var(--muted)}
.sum2 b{font:900 40px/1.1 var(--font)}
.sum2-lines{text-align:right;color:var(--muted);font-size:14px}
.fs .cash{gap:10px}
.item{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.item .nm{flex:1;min-width:0}
.item .nm b{font-size:21px;line-height:1.3}
.item .nm div{color:var(--ink);opacity:.75;font-size:16px}
.step{display:flex;align-items:center;gap:8px}
.step button{width:52px;height:52px;border-radius:14px;border:2px solid var(--accent);background:var(--surface);color:var(--accent);font:900 26px var(--font);cursor:pointer;line-height:1}
.step button:active{background:var(--accent-soft)}
.step .q{min-width:34px;text-align:center;font:900 24px var(--font)}
.total{display:flex;justify-content:space-between;align-items:baseline}
.total span{color:var(--muted)}
.total b{font:900 34px var(--font)}
.cash{display:flex;flex-direction:column;gap:8px}
.cash label{font-size:15px;font-weight:700;color:var(--ink)}
.cash input{font:900 30px var(--font);min-height:60px;text-align:right;padding:6px 16px;border:2px solid var(--accent);font-variant-numeric:tabular-nums}
.cash .quick{display:flex;gap:6px;flex-wrap:nowrap}
.cash .quick button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:6px 10px;font:700 17px var(--font);cursor:pointer;min-height:48px;flex:1 1 0;white-space:nowrap}
.change{font:900 24px var(--font);min-height:30px}
.change.short{color:var(--bad)}
.actions{display:grid;grid-template-columns:1fr 2fr;gap:10px}
.actions .btn{min-height:56px;font-size:18px}
.staffbar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.staffbar small{color:var(--muted);display:block}
.staffbar b{font-size:18px}
.dlg{position:fixed;top:0;left:0;right:0;bottom:0;z-index:40;background:rgba(10,18,34,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.dlg-box{background:var(--surface);border-radius:16px;padding:18px;width:100%;max-width:420px;display:flex;flex-direction:column;gap:12px}
.dlg-box h3{margin:0;font:900 18px var(--font)}
.dlg-box .quick{display:flex;gap:6px;flex-wrap:wrap}
.dlg-box .quick button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:99px;padding:8px 14px;font:700 15px var(--font);cursor:pointer;min-height:44px}
.dlg-box .quick button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.done{position:fixed;top:0;left:0;right:0;bottom:0;z-index:25;background:var(--good-soft);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
.done .mark{width:84px;height:84px;border-radius:50%;background:var(--good);color:#fff;display:flex;align-items:center;justify-content:center;font:900 48px var(--font)}
.done h2{margin:0;font:900 30px var(--font);color:var(--ink)}
.done p{margin:0;font-size:19px;font-weight:700}
.done ul{list-style:none;padding:0;margin:0;font-size:17px}
.done .next{margin-top:8px;min-height:64px;font-size:20px;padding:0 32px;border-radius:16px}
@media (min-width:760px){
  #app{max-width:1000px}
  main{padding:4px 24px 24px}
  header{padding-left:24px;padding-right:24px}
  .start{min-height:200px;font-size:36px}
  .stat-grid{grid-template-columns:repeat(4,1fr)}
  .stat.main{grid-column:span 2}
}

/* iPad(タブレット)向けの調整 */
@media (min-width:700px){
  #app{max-width:1100px}
  nav button{min-height:56px;font-size:16px}
  .btn{min-height:48px}
  .seg button{min-height:46px;font-size:15px}
  .fs-head,.fs-body{max-width:1100px}
  .fs-foot>*{max-width:1060px}
  .item .nm b{font-size:24px}
  .step button{width:60px;height:60px;font-size:30px}
  .step .q{font-size:28px;min-width:44px}
  .actions .btn{min-height:64px;font-size:20px}
  .cash .quick button{min-height:56px;font-size:19px}
  .cash input{font-size:34px;min-height:68px}
  .cu-foot button{min-height:64px;font-size:19px;padding:12px 28px}
  .btn.danger{min-height:48px;font-size:16px}
  .item .nm{min-width:150px}
}
@media (min-width:700px) and (max-height:620px){
  .cu-total{font-size:clamp(60px,26vh,200px)}
  .item{padding:8px 0}
  .done{gap:8px}
  .done .mark{width:64px;height:64px;font-size:36px}
  .done h2{font-size:26px}
}
@media (max-width:480px){
  .cash .quick{gap:4px}
  .cash .quick button{min-width:0;padding:6px 2px;font-size:15px}
}
@media (max-width:340px){
  .cash .quick button{font-size:13px;padding:6px 0}
}
@media (max-width:380px){
  .start{font-size:22px;min-height:120px}
  .stat .v{font-size:20px}
  .cash .quick button{font-size:15px;padding:6px 4px}
}

/* ===== ピクニック(中庭前の出店)テーマ ===== */
body{background-color:var(--bg);background-image:linear-gradient(90deg,rgba(217,69,47,.055) 50%,transparent 50%),linear-gradient(rgba(217,69,47,.055) 50%,transparent 50%);background-size:30px 30px}
.awning{flex:none;height:calc(20px + env(safe-area-inset-top));background:repeating-linear-gradient(90deg,var(--tomato) 0 32px,#fff8ec 32px 64px);position:relative;margin-bottom:14px}
.awning::after{content:"";position:absolute;left:0;right:0;top:100%;height:14px;background:repeating-linear-gradient(90deg,var(--tomato) 0 32px,#fff8ec 32px 64px);-webkit-mask:radial-gradient(circle 16px at 50% 0,#000 97%,transparent 100%) 0 0/32px 100% repeat-x;mask:radial-gradient(circle 16px at 50% 0,#000 97%,transparent 100%) 0 0/32px 100% repeat-x}
header{padding-top:6px}
header h1{font-size:21px;color:var(--ink)}
.tag{font-size:12px;color:var(--muted);margin-top:1px}
.chip{background:var(--accent-soft);color:var(--accent)}
nav{background:var(--surface);border-top:2px dashed var(--line)}
nav button[aria-current="true"]{color:var(--accent);border-top-color:var(--tomato)}
.card,.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 2px 0 rgba(120,90,50,.07)}
.stat.main{border-color:var(--accent)}
.start{background-color:var(--tomato);background-image:linear-gradient(90deg,rgba(255,255,255,.14) 50%,transparent 50%),linear-gradient(rgba(255,255,255,.14) 50%,transparent 50%);background-size:28px 28px;color:#fff;border-radius:22px;box-shadow:0 5px 0 #a8321f;text-shadow:0 1px 0 rgba(0,0,0,.18)}
.start:active{filter:none;transform:translateY(3px);box-shadow:0 2px 0 #a8321f}
.btn{border-radius:14px}
.seg button{border-width:2px}
.step button{border-color:var(--accent);color:var(--accent);background:#fff}
.fs{background-color:var(--bg);background-image:linear-gradient(90deg,rgba(217,69,47,.055) 50%,transparent 50%),linear-gradient(rgba(217,69,47,.055) 50%,transparent 50%);background-size:30px 30px}
.fs-foot{background:var(--surface);border-top:2px dashed var(--line)}
.fs-cust{background:#2c5a43;background-image:linear-gradient(90deg,rgba(255,255,255,.05) 50%,transparent 50%),linear-gradient(rgba(255,255,255,.05) 50%,transparent 50%);background-size:40px 40px;color:#fff8e6}
.cu-total{color:#ffe38a}
.done{background-color:var(--good-soft);background-image:linear-gradient(90deg,rgba(47,125,79,.07) 50%,transparent 50%),linear-gradient(rgba(47,125,79,.07) 50%,transparent 50%);background-size:30px 30px}
.done h2{color:var(--ink)}
.ticket{background:var(--sun);color:var(--ink);border-radius:22px;padding:10px 36px 8px;box-shadow:0 5px 0 #d4a92a;border:3px solid #fff8d6}
.ticket small{display:block;font-size:17px;font-weight:700;letter-spacing:.2em}
.ticket b{display:block;font:900 clamp(64px,14vw,120px)/1.05 var(--font)}
.tk-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.tk-fields label{display:block;margin-bottom:4px}
/* 受け渡しボード */
.board-sum{background:#fff4cf;border:2px solid var(--sun)}
.board-sum h2{color:var(--ink)}
.cook{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed #e6c95b}
.cook:last-child{border-bottom:0}
.cook span{font:700 18px var(--font)}
.cook b{font:900 clamp(44px,12vw,64px)/1.05 var(--font);color:var(--tomato)}
.cook b small{font-size:20px;color:var(--ink);margin-left:4px}
.tk{display:flex;gap:12px;align-items:center;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:10px 12px;box-shadow:0 2px 0 rgba(120,90,50,.07)}
.tk .no{min-width:84px;text-align:center;border-radius:14px;padding:6px 10px;font:900 clamp(30px,8vw,44px)/1.1 var(--font)}
.tk .no small{display:block;font:700 11px var(--font);letter-spacing:.1em}
.tk.making{border-color:var(--sun)}
.tk.making .no{background:var(--sun);box-shadow:0 3px 0 #d4a92a}
.tk.late{border-color:var(--tomato)}
.tk.late .no{background:#ffd0c7;box-shadow:0 3px 0 #d98c7e}
.tk.served{opacity:.72}
.tk.served .no{background:var(--good-soft);color:var(--good)}
.tk .info{flex:1;min-width:0}
.tk .info b{display:block;font:700 16px/1.45 var(--font);word-break:keep-all;overflow-wrap:anywhere}
.tk .info b i{display:block;font-style:normal}
@media (max-width:420px){.tk{gap:8px;padding:10px}.tk .no{min-width:64px;padding:6px 6px}.tk .btn{padding:10px 10px;font-size:14px}.tk .info b{font-size:15px}nav button{font-size:13px;white-space:nowrap;padding-left:2px;padding-right:2px}.tabbadge{margin-left:2px;padding:0 5px}}
.tk .info .sub{color:var(--muted);font-size:12px}
.tk .btn{min-height:56px;padding:10px 14px;white-space:nowrap}
.tk.served .btn{min-height:44px}
.qrs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.qr{text-align:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 6px}
.qr img{width:100%;max-width:170px;height:auto;image-rendering:pixelated;display:block;margin:0 auto 6px}
.qr b{display:block;font:700 15px var(--font)}
.qr span{display:block;font-size:12px;color:var(--muted)}
.tabbadge{display:inline-block;min-width:20px;padding:0 6px;border-radius:99px;background:var(--tomato);color:#fff;font:900 12px/20px var(--font);margin-left:4px;vertical-align:1px}
.toast{bottom:auto;top:calc(52px + env(safe-area-inset-top));width:max-content;max-width:92%;text-align:center;background:var(--ink);color:#fff8e6;box-shadow:0 3px 0 rgba(0,0,0,.2)}
@media (min-width:700px){.awning{height:calc(24px + env(safe-area-inset-top))}header h1{font-size:24px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== シンプルテーマ(運営スタッフ用) ===== */
body,.fs,.done{background-image:none}
.awning{display:none}
header{padding-top:calc(10px + env(safe-area-inset-top))}
header h1{font-size:20px}
@media (min-width:700px){header h1{font-size:22px}}
nav{border-top:1px solid var(--line)}
nav button[aria-current="true"]{border-top-color:var(--accent)}
.card,.stat{border-radius:10px;box-shadow:none}
.btn,.seg button,.step button{border-radius:10px}
.start{background-image:none;background-color:var(--accent);border-radius:14px;box-shadow:none}
.start:active{transform:none;box-shadow:none;filter:brightness(.92)}
.fs-foot{border-top:1px solid var(--line)}
.fs-cust{background:#fdebc8;background-image:none;color:#4a3426}
.cu-total{color:#c2410c}
.cu-label{opacity:1;color:#7a5a3c}
.cu-lines{color:#4a3426}
.cu-lines li{border-bottom:1px solid rgba(122,90,60,.22);padding-bottom:4px}
.cu-foot button{background:rgba(255,255,255,.55);border-color:#c9a878;color:#4a3426;opacity:1}
.done{background-color:var(--good-soft)}
.ticket{border-radius:14px;box-shadow:none;border:2px solid #e0b92a}
.board-sum{background:#fff8dc;border:1px solid #e6c95b}
.cook{border-bottom:1px solid #e6c95b}
.tk{border-width:1px;border-radius:10px;box-shadow:none}
.tk.making .no,.tk.late .no{box-shadow:none}
.tk.making{border-color:#e6c95b}
.toast{box-shadow:none}
.eq{display:flex;align-items:flex-end;justify-content:space-between;gap:4px;margin:6px 0 10px}
.eq>div{display:flex;flex-direction:column;align-items:center;min-width:0}
.eq small{font-size:13px;color:var(--muted)}
.eq b{font:900 clamp(20px,6.4vw,52px)/1.15 var(--font);white-space:nowrap}
.eq>span{font:700 clamp(20px,5vw,40px)/1.15 var(--font);color:var(--muted);padding-bottom:2px}
.eqres{border-radius:12px;padding:10px 12px;text-align:center}
.eqres small{display:block;font-size:14px;font-weight:700}
.eqres b{display:block;font:900 clamp(30px,10vw,76px)/1.15 var(--font);white-space:nowrap}

/* ===== 在庫 ===== */
.stockcard{border-width:2px}
.stockcard.ok{background:#e3f2e6;border-color:#8cc59a}
.stockcard.warn{background:#fff1d0;border-color:#e0b92a}
.stockcard.bad{background:#fbe3de;border-color:#d98c7e}
.stock-big{display:flex;align-items:baseline;justify-content:center;gap:6px;margin:2px 0}
.stock-big b{font:900 clamp(64px,22vw,130px)/1.05 var(--font)}
.stock-big small{font:700 24px var(--font)}
.stockcard.ok .stock-big{color:var(--good)}.stockcard.warn .stock-big{color:#8a5a00}.stockcard.bad .stock-big{color:var(--bad)}
.stock-st{text-align:center;font:700 17px var(--font);margin-bottom:10px}
.stock-row{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;text-align:center;border-top:1px solid rgba(0,0,0,.1);padding-top:8px}
.stock-row small{display:block;font-size:12px;color:var(--muted)}
.stock-row b{font:900 20px/1.2 var(--font)}
.qbig{font:900 clamp(56px,20vw,110px)/1.05 var(--font);text-align:center}
.qbtns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.qbtns button{border:2px solid var(--accent);background:var(--surface);color:var(--accent);border-radius:12px;font:900 22px var(--font);min-height:56px;cursor:pointer}
.qbtns button.sub{border-color:var(--line);color:var(--muted);font-size:15px}
.qbtns button:active{background:var(--accent-soft)}
.bigbtn{display:block;width:100%;margin-top:12px;min-height:60px;font-size:19px;border-radius:14px}
.hist{list-style:none;margin:0;padding:0}
.hist li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.hist li:last-child{border-bottom:0}
.hist .tm{color:var(--muted);min-width:52px}
.hist .q{font:900 20px var(--font);min-width:70px}
.hist .why{flex:1;color:var(--muted);font-size:13px}
.lowbox{display:flex;align-items:center;gap:8px}
.lowbox input{width:80px;font:700 18px var(--font);padding:8px;border:1px solid var(--line);border-radius:8px;text-align:center}
.reqbar{margin:10px auto 0;max-width:420px;text-align:center;background:#fde9b8;border:2px solid #e0a63a;color:#6b4300;border-radius:12px;padding:10px 12px;font-size:1.05rem}.reqbar b{font-size:1.5rem}
</style>
</head>
<body>
<div id="app">
    <header>
    <div><h1>理大祭・レジ</h1></div>
    <span id="status" class="chip warn">確認中…</span>
  </header>
  <main id="view"></main>
  <nav id="tabs">
    <button data-tab="register">レジ</button>
    <button data-tab="board" id="tab-board">受け渡し</button>
    <button data-tab="sales">売上確認</button>
    <button data-tab="settings">設定</button>
  </nav>
</div>
<div id="modal-root"></div>
<div id="staff-root"></div>
<div id="toast-root"></div>
<script>
(function(){
  'use strict';
  /* ===== 送信先(Googleフォーム)の設定。フォーム作成後に書き換える ===== */
  var FORM_URL='https://docs.google.com/forms/d/e/1FAIpQLSfsI41eFSmeukpIQWZ4ZN1v2ICr2LoW2L-SFoAKDKgSmk85Uw/formResponse';   /* 例: https://docs.google.com/forms/d/e/XXXX/formResponse */
  var ENTRY={id:'entry.541146138',kind:'entry.1988070427',date:'entry.1172544032',time:'entry.709787758',by:'entry.1456409413',name:'entry.1686593036',qty:'entry.1570345409',amount:'entry.735398157'};
  /* 受け渡し同期（Apps Scriptのウェブアプリ URL。空のままなら同期しない） */
  var BOARD_URL='https://script.google.com/macros/s/AKfycbwZll-5cY49gg9ejxwBMWserUUjvOYcw1rcZhIsqXOOX7XMYYPN97MpPHr-bsUYvbSqpA/exec';
  /* ================================================================ */
  var IS_PICKUP=/[?&]view=pickup\b/.test(location.search);   /* 受け渡し担当の端末（提供済みを押す） */
  var IS_CANAL=/[?&]view=canal\b/.test(location.search);   /* カナル調理担当の閲覧画面 */
  var IS_COOK=IS_PICKUP||IS_CANAL||/[?&]view=cook\b/.test(location.search);
  var IS_STOCK=/[?&]view=stock\b/.test(location.search);   /* 在庫管理（出荷・調整の入力）*/
  var STOCK_ITEM='ソーセージロール';   /* 在庫を数える商品名 */
  var DAYS=[{key:'2026-11-20',label:'11/20(金)'},{key:'2026-11-21',label:'11/21(土)'}];
  var state={products:[],orders:[]};
  var ui={tab:'register',day:null,sumDay:'all',report:'',cart:null,done:null};
  var backend=null;

  function jstToday(){return new Date(Date.now()+9*3600e3).toISOString().slice(0,10);}
  ui.day=DAYS.some(function(d){return d.key===jstToday();})?jstToday():DAYS[0].key;
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function yen(n){return '¥'+Math.round(n||0).toLocaleString('ja-JP');}
  function dayLabel(k){var d=DAYS.filter(function(x){return x.key===k;})[0];return d?d.label:k.slice(5).replace('-','/');}
  function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
  function getName(){try{return localStorage.getItem('reji-name')||'';}catch(e){return '';}}
  function setName(v){
    try{localStorage.setItem('reji-name',v);
      if(v){var l=staffList().filter(function(x){return x!==v;});l.unshift(v);localStorage.setItem('reji-staff-list',JSON.stringify(l.slice(0,6)));}
    }catch(e){}
  }
  function staffList(){try{return JSON.parse(localStorage.getItem('reji-staff-list')||'[]');}catch(e){return [];}}
  function sortedProducts(){return state.products.slice().sort(function(a,b){return (a.order||0)-(b.order||0);});}
  /* 整理番号(揚げ時間の関係で整理番号で受付する場合に使用) */
  function lsGet(k,d){try{var v=localStorage.getItem(k);return v===null?d:v;}catch(e){return d;}}
  function lsSet(k,v){try{localStorage.setItem(k,String(v));}catch(e){}}
  function ticketOn(){return lsGet('reji-ticket-on','1')==='1';}
  function ticketPrefix(){return lsGet('reji-ticket-prefix','');}
  function ticketNext(day){return Math.max(1,parseInt(lsGet('reji-ticket-n-'+day,'1'),10)||1);}
  function takeTicket(day){var n=ticketNext(day);lsSet('reji-ticket-n-'+day,n+1);return ticketPrefix()+n;}
  function timeStr(ts){return new Date(ts).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});}

  /* ---------- storage (この端末に保存) ---------- */
  function localBackend(){
    var subs={},mem={};
    function load(col){try{return JSON.parse(localStorage.getItem('reji-'+col)||'[]');}catch(e){return [];}}
    function save(col,arr){try{localStorage.setItem('reji-'+col,JSON.stringify(arr));}catch(e){}}
    function get(col){return mem[col]||(mem[col]=load(col));}
    function emit(col){(subs[col]||[]).forEach(function(cb){cb(get(col).slice());});}
    return {
      subscribe:function(col,cb){(subs[col]=subs[col]||[]).push(cb);setTimeout(function(){emit(col);},0);},
      set:function(col,id,obj){var a=get(col).filter(function(x){return x.id!==id;});a.push(Object.assign({},obj,{id:id}));mem[col]=a;save(col,a);emit(col);return Promise.resolve();},
      del:function(col,id){mem[col]=get(col).filter(function(x){return x.id!==id;});save(col,mem[col]);emit(col);return Promise.resolve();}
    };
  }
  function start(b){
    backend=b;
    var seeded=false;
    b.subscribe('products',function(rows){
      state.products=rows;
      if(!seeded){seeded=true;seedProducts(rows);}
      render();
    });
    b.subscribe('orders',function(rows){state.orders=rows;render();});
    updateStatus();
  }
  function seedProducts(rows){
    if(rows.length) return;
    try{if(localStorage.getItem('reji-seeded')) return;}catch(e){}
    [{id:'p-sausage',name:'ソーセージロール',price:350,order:1},{id:'p-appletea',name:'アップルティー',price:150,order:2}].forEach(function(p){backend.set('products',p.id,p);});
    try{localStorage.setItem('reji-seeded','1');}catch(e){}
  }
  /* ---------- 受け渡し同期(調理担当の画面へ) ---------- */
  var bq=[],bSending=false;
  function loadBq(){try{bq=JSON.parse(localStorage.getItem('reji-boardq')||'[]');}catch(e){bq=[];}}
  function saveBq(){try{localStorage.setItem('reji-boardq',JSON.stringify(bq));}catch(e){}}
  function boardPush(msg){if(!BOARD_URL)return;bq.push(msg);saveBq();flushBoard();}
  function flushBoard(){
    if(!BOARD_URL||bSending||!bq.length)return;
    bSending=true;
    (function next(){
      if(!bq.length){bSending=false;if(ui.tab==='board'&&!document.activeElement.matches('input,textarea'))render();return;}
      fetch(BOARD_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(bq[0])})
        .then(function(){bq.shift();saveBq();next();})
        .catch(function(){bSending=false;});
    })();
  }
  var lastPull=0;
  var exp={v:null,at:0};
  function pullBoard(){
    if(!BOARD_URL||IS_COOK||document.hidden||bq.length||!backend)return;
    fetch(BOARD_URL+(BOARD_URL.indexOf('?')<0?'?':'&')+'t='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(j){
      if(typeof j.expense==='number'&&isFinite(j.expense)){var ch=exp.v!==j.expense;exp.v=j.expense;exp.at=Date.now();if(ch&&ui.tab==='sales'&&!ui.cart&&!ui.done)render();}
      if(bq.length)return;
      var map={};
      (j.orders||[]).forEach(function(o){map[o.id]={status:'making',servedAt:null};});
      (j.served||[]).forEach(function(o){map[o.id]={status:'served',servedAt:o.servedAt||Date.now()};});
      state.orders.forEach(function(lo){
        var m=map[lo.id];
        if(m&&(lo.status||'served')!==m.status){backend.set('orders',lo.id,Object.assign({},lo,{status:m.status,servedAt:m.servedAt}));}
      });
    }).catch(function(){});
  }
  function guard(p){return Promise.resolve(p).catch(function(){toast('保存できませんでした');});}

  /* ---------- 送信キュー(Googleフォームへ) ---------- */
  var outbox=[],sending=false;
  function loadOutbox(){try{outbox=JSON.parse(localStorage.getItem('reji-outbox')||'[]');}catch(e){outbox=[];}}
  function saveOutbox(){try{localStorage.setItem('reji-outbox',JSON.stringify(outbox));}catch(e){}}
  function formReady(){return !!(FORM_URL&&ENTRY.id&&ENTRY.kind&&ENTRY.date&&ENTRY.time&&ENTRY.by&&ENTRY.name&&ENTRY.qty&&ENTRY.amount);}
  function pad2(n){return (n<10?'0':'')+n;}
  /* order → フォーム1行ずつ(商品ごと)。kind: 売上 / 取消 */
  function enqueue(order,kind){
    var d=new Date(order.ts+9*3600e3);
    var dateS=order.day.replace(/-/g,'/');
    var timeS=pad2(d.getUTCHours())+':'+pad2(d.getUTCMinutes())+':'+pad2(d.getUTCSeconds());
    (order.items||[]).forEach(function(it,i){
      outbox.push({k:order.id+'|'+kind+'|'+i,f:[order.id,kind,dateS,timeS,order.by||'',it.name,String(it.qty),String(it.qty*it.price)]});
    });
    saveOutbox();updateStatus();flush();
  }
  function sendOne(rec){
    var body=new URLSearchParams();
    var keys=['id','kind','date','time','by','name','qty','amount'];
    keys.forEach(function(k,i){body.append(ENTRY[k],rec.f[i]);});
    return fetch(FORM_URL,{method:'POST',mode:'no-cors',body:body});
  }
  function flush(){
    if(sending||!formReady()||!outbox.length){updateStatus();return;}
    sending=true;updateStatus();
    (function next(){
      if(!outbox.length){sending=false;updateStatus();render();return;}
      var rec=outbox[0];
      sendOne(rec).then(function(){
        outbox.shift();saveOutbox();updateStatus();next();
      }).catch(function(){sending=false;updateStatus();});
    })();
  }
  function updateStatus(){
    var el=document.getElementById('status');if(!el)return;
    if(!formReady()){el.textContent='送信先未設定';el.className='chip warn';}
    else if(outbox.length){el.textContent='未送信 '+outbox.length+'件';el.className='chip warn';}
    else{el.textContent='送信済み';el.className='chip';}
    if(ui.tab==='sales'&&!document.activeElement.matches('input,textarea'))render();
  }

  /* ---------- calc ---------- */
  function calcSales(dayKey){
    var orders=state.orders.filter(function(o){return dayKey==='all'||o.day===dayKey;});
    var by={},revenue=0,qty=0;
    orders.forEach(function(o){(o.items||[]).forEach(function(it){
      var r=by[it.name]||(by[it.name]={name:it.name,qty:0,amount:0});
      r.qty+=it.qty;r.amount+=it.qty*it.price;qty+=it.qty;revenue+=it.qty*it.price;
    });});
    return {orders:orders,byProd:Object.keys(by).map(function(k){return by[k];}),revenue:revenue,qty:qty};
  }

  /* ---------- main views ---------- */
  function dayChips(current,withAll,attr){
    var h='<div class="seg" role="group" aria-label="日付">';
    if(withAll) h+='<button type="button" data-act="'+attr+'" data-v="all" aria-pressed="'+(current==='all')+'">全日</button>';
    DAYS.forEach(function(d){h+='<button type="button" data-act="'+attr+'" data-v="'+d.key+'" aria-pressed="'+(current===d.key)+'">'+d.label+'</button>';});
    return h+'</div>';
  }
  function registerView(){
    var c=calcSales(ui.day);
    var unpriced=state.products.some(function(p){return !p.price;});
    var h='<section>';
    h+='<div class="card staffbar"><div><small>レジ担当</small><b>'+(getName()?esc(getName()):'未設定')+'</b></div><button type="button" class="btn ghost" data-act="staff">担当を変更</button></div>';
    h+='<div class="card"><h2>販売日</h2>'+dayChips(ui.day,false,'setday')+'</div>';
    if(unpriced) h+='<div class="chip warn" style="border-radius:10px;padding:8px 12px;white-space:normal">単価が0円の商品があります。「設定」で単価を入れてください。</div>';
    h+='<button type="button" class="start" data-act="open">お客様の会計を始める</button>';
    h+='<div class="stat-grid"><div class="stat"><small>'+dayLabel(ui.day)+' 会計数</small><div class="v num">'+c.orders.length+'件</div></div><div class="stat"><small>販売数</small><div class="v num">'+c.qty+'個</div></div></div>';
    var recent=c.orders.slice().sort(function(a,b){return b.ts-a.ts;}).slice(0,3);
    if(recent.length){
      h+='<div class="card"><h2>直近の会計</h2><ul class="log">';
      recent.forEach(function(o){h+='<li><div class="main">'+orderText(o)+'<div class="sub">'+timeStr(o.ts)+'</div></div><b class="num">'+yen(o.total)+'</b></li>';});
      h+='</ul></div>';
    }
    return h+'</section>';
  }
  function unitFor(n){return /ロール|ソーセージ/.test(n)?'本':/ティー|茶|ドリンク|コーヒー|ジュース/.test(n)?'杯':'個';}
  function boardText(o){return (o.items||[]).map(function(it){return '<i>'+esc(it.name)+'×'+it.qty+'</i>';}).join('');}
  function isMaking(o){return o.status==='making';}
  function makingCount(){return state.orders.filter(isMaking).length;}
  function setStatus(id,st){
    var o=state.orders.filter(function(x){return x.id===id;})[0];if(!o||!backend)return;
    var no=Object.assign({},o,{status:st,servedAt:st==='served'?Date.now():null});
    guard(backend.set('orders',id,no));
    boardPush({op:'upsert',order:no});
  }
  function boardView(){
    var list=state.orders.filter(function(o){return o.day===ui.day;});
    var making=list.filter(isMaking).sort(function(a,b){return a.ts-b.ts;});
    var served=list.filter(function(o){return !isMaking(o);}).sort(function(a,b){return (b.servedAt||b.ts)-(a.servedAt||a.ts);});
    var by={},names=[];
    making.forEach(function(o){(o.items||[]).forEach(function(it){if(!by[it.name]){by[it.name]=0;names.push(it.name);}by[it.name]+=it.qty;});});
    var h='<section><div class="card"><h2>販売日</h2>'+dayChips(ui.day,false,'setday')+'</div>';
    h+='<div class="card board-sum"><h2>いま作る数（作成中の合計）</h2>';
    if(!names.length) h+='<div class="empty">作成中のご注文はありません</div>';
    names.forEach(function(n){h+='<div class="cook"><span>'+esc(n)+'</span><b class="num">'+by[n]+'<small>'+unitFor(n)+'</small></b></div>';});
    h+='</div>';
    h+='<div class="card"><h2>作成中 '+making.length+'件（古い順）</h2><div style="display:flex;flex-direction:column;gap:10px">';
    if(!making.length) h+='<div class="empty">なし</div>';
    making.forEach(function(o){
      var m=Math.max(0,Math.floor((Date.now()-o.ts)/60000));
      h+='<div class="tk making'+(m>=10?' late':'')+'"><div class="no num"><small>'+(o.ticket?'整理番号':'会計')+'</small>'+(o.ticket?esc(o.ticket):timeStr(o.ts))+'</div><div class="info"><b>'+boardText(o)+'</b><div class="sub">'+m+'分経過'+(m>=10?'（お待たせしています）':'')+'</div></div>'+(BOARD_URL?'':'<button type="button" class="btn" data-act="serve" data-id="'+esc(o.id)+'">提供済み</button>')+'</div>';
    });
    h+='</div></div>';
    h+='<div class="card"><h2>提供済み '+served.length+'件（新しい順）</h2><div style="display:flex;flex-direction:column;gap:8px">';
    if(!served.length) h+='<div class="empty">なし</div>';
    served.forEach(function(o){
      h+='<div class="tk served"><div class="no num"><small>'+(o.ticket?'整理番号':'会計')+'</small>'+(o.ticket?esc(o.ticket):timeStr(o.ts))+'</div><div class="info"><b>'+boardText(o)+'</b><div class="sub">提供済み'+(o.servedAt?' '+timeStr(o.servedAt):'')+'</div></div>'+(BOARD_URL?'':'<button type="button" class="btn ghost" data-act="unserve" data-id="'+esc(o.id)+'">作成中に戻す</button>')+'</div>';
    });
    h+='</div></div>';
    if(BOARD_URL){

  function render(){

    if(ui.tab==='settings'&&a&&a.tagName==='INPUT'&&v.contains(a)){return;}
    v.innerHTML=ui.tab==='register'?registerView():ui.tab==='board'?boardView():ui.tab==='sales'?salesView():settingsView();

    document.querySelectorAll('#tabs button').forEach(function(b){b.setAttribute('aria-current',b.dataset.tab===ui.tab);});

  /* ---------- checkout ---------- */
  function cartTotals(){
    var total=0,qty=0,items=[];
    sortedProducts().forEach(function(p){var q=ui.cart.qty[p.id]||0;if(q>0){items.push({productId:p.id,name:p.name,price:p.price||0,qty:q});total+=q*(p.price||0);qty+=q;}});
    return {total:total,qty:qty,items:items};
  }
  function linesHtml(t){
    if(!t.items.length) return '<li class="none">商品を選んでください</li>';
    return t.items.map(function(it){return '<li><span>'+esc(it.name)+' × '+it.qty+'</span><span class="num">'+yen(it.qty*it.price)+'</span></li>';}).join('');
  }

  function refreshCart(){

  function confirmOrder(){
    var t=cartTotals();if(!t.qty||!backend)return;
    var rec=ui.cart.received===''?0:(parseInt(ui.cart.received,10)||0);
    if(rec&&rec<t.total){toast('お預かり金額が足りません');return;}
    var id=uid();
    var order={id:id,day:ui.day,items:t.items,total:t.total,received:rec,change:rec?rec-t.total:0,by:getName(),ts:Date.now(),status:'making'};
    if(ticketOn()) order.ticket=takeTicket(ui.day);
    guard(backend.set('orders',id,order));
    enqueue(order,'売上');
    boardPush({op:'upsert',order:order});
    ui.done={id:id,order:order,ticket:order.ticket||'',items:t.items,total:t.total,received:rec,change:order.change};
    ui.cart=null;renderModal();
  }
  function cancelOrder(order){
    if(!order) return;
    guard(backend.del('orders',order.id));
    enqueue(order,'取消');
    boardPush({op:'del',id:order.id});
  }

  /* ---------- 予備の日報(★売上 A5に貼る4列) ---------- */
  function buildReport(){
    var by={},keys=[];
    state.orders.forEach(function(o){
      if(ui.sumDay!=='all'&&o.day!==ui.sumDay) return;
      (o.items||[]).forEach(function(it){
        var k=o.day+'|'+it.name;
        if(!by[k]){by[k]={day:o.day,name:it.name,qty:0,amount:0};keys.push(k);}
        by[k].qty+=it.qty;by[k].amount+=it.qty*it.price;
      });
    });
    keys.sort();
    return keys.length?keys.map(function(k){var r=by[k];return [r.day.replace(/-/g,'/'),r.name,r.qty,r.amount].join('\t');}).join('\n'):'記録なし';
  }

    if(a==='setday'){ui.day=v;render();}

      catch(e){var ta=document.getElementById('reporttxt');if(ta){ta.focus();ta.select();}}

  /* ---------- 在庫（ソーセージロール） ---------- */
  function stockCalc(day,orders,served,events){
    var ship=0,adj=0,ordered=0,sv=0;
    (events||[]).forEach(function(e){if(e.day!==day)return;if(e.kind==='ship')ship+=e.qty;else if(e.kind==='adjust')adj+=e.qty;});
    function cnt(o){var n=0;(o.items||[]).forEach(function(it){if(it.name===STOCK_ITEM)n+=it.qty;});return n;}
    (orders||[]).forEach(function(o){if(o.day===day)ordered+=cnt(o);});
    (served||[]).forEach(function(o){if(o.day===day){var c=cnt(o);ordered+=c;sv+=c;}});
    return {ship:ship,adj:adj,ordered:ordered,served:sv,making:ordered-sv,stock:ship+adj-ordered};
  }
  function stockLow(events){var b=null;(events||[]).forEach(function(e){if(e.kind==='cfg'&&(!b||e.ts>b.ts))b=e;});return b?Math.max(0,b.qty):15;}
  function reqBar(events,day){
    var n=0,t=0;(events||[]).forEach(function(e){if(e.day===day&&e.kind==='req'&&e.reason!=='done'){n+=e.qty;if(!t||e.ts<t)t=e.ts;}});
    return n?'<div class="reqbar">発注中 <b class="num">'+n+'本</b>（'+Math.max(0,Math.floor((Date.now()-t)/60000))+'分前に発注）</div>':'';
  }
  function stockCard(c,day,events){
    var low=stockLow(events),cl,tx;
    if(c.stock<0){cl='bad';tx='売りすぎです（在庫が足りません）';}
    else if(c.stock<=low){cl='warn';tx='発注の目安です（残り'+low+'本以下）';}
    else{cl='ok';tx='足りています';}
    var last=0;(events||[]).forEach(function(e){if(e.day===day&&e.kind==='ship'&&e.ts>last)last=e.ts;});
    var ago=last?'最後の出荷 '+Math.max(0,Math.floor((Date.now()-last)/60000))+'分前（'+timeStr(last)+'）':'この日の出荷はまだありません';
    var adjS=(c.adj>0?'+':c.adj<0?'−':'')+Math.abs(c.adj);
    return '<div class="card stockcard '+cl+'"><h2>テント在庫（'+dayLabel(day)+'・'+esc(STOCK_ITEM)+'）</h2><div class="stock-big"><b class="num">'+c.stock+'</b><small>本</small></div><div class="stock-st">'+tx+'</div>'+reqBar(events,day)
      +'<div class="stock-row"><div><small>出荷</small><b class="num">'+c.ship+'</b></div><div><small>調整</small><b class="num">'+adjS+'</b></div><div><small>注文</small><b class="num">'+c.ordered+'</b></div><div><small>提供済み</small><b class="num">'+c.served+'</b></div><div><small>作成中</small><b class="num">'+c.making+'</b></div></div>'
      +'<p class="note" style="margin:8px 0 0;text-align:center">在庫 ＝ 出荷 ＋ 調整 − 注文　／　'+ago+'</p></div>';
  }

        return '<li><span class="tm num">'+timeStr(e.ts)+'</span><b class="q num">'+q+'</b><span class="why">'+esc(why)+'</span><button type="button" class="btn danger" data-sa="void" data-id="'+esc(e.id)+'">'+(st.confirm===e.id?'もう一度押すと取消':'取消')+'</button></li>';

      if(st.noStock)h+='<div class="card" style="border-color:var(--bad);background:#fbe3de"><b>Apps Scriptが古いままです。</b><div class="note" style="margin:4px 0 0">出荷と調整が、サーバーに保存されていません。この画面を開き直すと消えます。Apps Scriptを新しい内容に置き換えて、再デプロイしてください。</div></div>';

        h+='<div class="card"><h2>担当を交代するとき</h2><p class="note" style="margin:0">記録はすべてサーバーに保存されています。新しい端末で、同じURLを開くだけで続けられます。交代前に、上に「送信待ち」が出ていないことを確認してください（'+(bq.length?'いま送信待ち '+bq.length+'件':'いま送信待ちなし ✓')+'）。'+(lastOp?'最後の操作は '+timeStr(lastOp)+' です。':'')+'</p></div>';
        h+='<div class="card"><h2>出荷の記録（'+dayLabel(st.day)+'・新しい順）</h2>'+hist('ship').replace(/<button[^>]*data-sa="void"[^>]*>.*?<\/button>/g,'')+'</div>';
        h+='<div class="card"><h2>調整の記録（'+dayLabel(st.day)+'・新しい順）</h2>'+hist('adjust').replace(/<button[^>]*data-sa="void"[^>]*>.*?<\/button>/g,'')+'</div>';
      }else if(st.tab==='req'){
        h+='<div class="card"><h2>カナルに発注する本数</h2><div class="qbig num">'+st.rq+'<small style="font-size:.3em"> 本</small></div><div class="qbtns"><button type="button" data-sa="rq" data-v="1">+1</button><button type="button" data-sa="rq" data-v="5">+5</button><button type="button" data-sa="rq" data-v="10">+10</button><button type="button" data-sa="rq" data-v="20">+20</button><button type="button" class="sub" data-sa="rq" data-v="-1">−1</button><button type="button" class="sub" data-sa="rq" data-v="-5">−5</button><button type="button" class="sub" data-sa="rq" data-v="0" style="grid-column:span 2">0に戻す</button></div>'
          +'<button type="button" class="btn bigbtn" data-sa="req"'+(st.rq>0?'':' disabled')+'>'+(st.rq>0?st.rq+'本を発注する':'本数を入れてください')+'</button><p class="note" style="margin:8px 0 0">出荷を記録すると、発注は自動で「出荷済み」になります。</p></div>';
        h+='<div class="card"><h2>発注の記録（'+dayLabel(st.day)+'・新しい順）</h2>'+hist('req')+'</div>';
      }else if(st.tab==='ship'){
        h+='<div class="card"><h2>いま運び出す本数</h2><div class="qbig num">'+st.qty+'<small style="font-size:.3em"> 本</small></div><div class="qbtns"><button type="button" data-sa="sq" data-v="1">+1</button><button type="button" data-sa="sq" data-v="5">+5</button><button type="button" data-sa="sq" data-v="10">+10</button><button type="button" data-sa="sq" data-v="20">+20</button><button type="button" class="sub" data-sa="sq" data-v="-1">−1</button><button type="button" class="sub" data-sa="sq" data-v="-5">−5</button><button type="button" class="sub" data-sa="sq" data-v="0" style="grid-column:span 2">0に戻す</button></div>'
          +'<button type="button" class="btn bigbtn" data-sa="ship"'+(st.qty>0?'':' disabled')+'>'+(st.qty>0?st.qty+'本の出荷を記録する':'本数を入れてください')+'</button></div>';
        h+='<div class="card"><h2>出荷の記録（'+dayLabel(st.day)+'・日計 '+c.ship+'本）</h2>'+hist('ship')+'</div>';

            +'<h2 style="margin-top:14px">増やす・減らす</h2><div class="seg" role="group" aria-label="符号"><button type="button" data-sa="sign" data-v="1" aria-pressed="'+(st.sign===1)+'">＋ 増やす</button><button type="button" data-sa="sign" data-v="-1" aria-pressed="'+(st.sign===-1)+'">− 減らす</button></div>'
            +'<div class="qbig num" style="margin-top:10px">'+(st.sign>0?'+':'−')+st.aq+'<small style="font-size:.3em"> 本</small></div><div class="qbtns"><button type="button" data-sa="aq" data-v="1">+1</button><button type="button" data-sa="aq" data-v="5">+5</button><button type="button" data-sa="aq" data-v="10">+10</button><button type="button" data-sa="aq" data-v="20">+20</button><button type="button" class="sub" data-sa="aq" data-v="-1">−1</button><button type="button" class="sub" data-sa="aq" data-v="-5">−5</button><button type="button" class="sub" data-sa="aq" data-v="0" style="grid-column:span 2">0に戻す</button></div>'
            +'<button type="button" class="btn bigbtn" data-sa="adj"'+(st.aq>0?'':' disabled')+'>'+(st.aq>0?st.reason+'：'+(st.sign>0?'+':'−')+st.aq+'本を記録する':'本数を入れてください')+'</button></div>';
        }else{
          h+='<div class="card"><h2>いま、揚げる前のロールは何本ありますか</h2><div class="lowbox"><input id="st-actual" type="number" inputmode="numeric" min="0" placeholder="数えた本数" value="'+esc(st.actual)+'"><span>本</span></div>'
            +'<p class="note" style="margin:8px 0 0">計算上の在庫は '+c.stock+'本です。入れた本数との差を、自動で調整として記録します。<br>作成中の注文がないときに数えてください。'+(c.making>0?'いまは作成中が '+c.making+'本あります。揚げ待ちの分は引いて入力してください。':'')+'</p>'
            +'<button type="button" class="btn bigbtn" data-sa="actual">この本数にそろえる</button></div>';

    function send(msg){boardPush(msg);}
    function addEvent(kind,qty,reason,day){
      var e={id:uid(),day:day||st.day,kind:kind,qty:qty,reason:reason||'',ts:Date.now()};
      events.push(e);local[e.id]=e;lastAct=Date.now();send({op:'stock',event:e});
    }
    document.addEventListener('click',function(ev){
      var t=ev.target.closest('[data-sa]');if(!t)return;
      var a=t.dataset.sa,v=t.dataset.v;
      if(a==='tab'){st.tab=v;st.confirm=null;drawNav();var m=document.getElementById('view');if(m)m.scrollTop=0;}
      else if(a==='day'){st.day=v;st.confirm=null;}
      else if(a==='rq'){st.rq=v==='0'?0:Math.max(0,st.rq+parseInt(v,10));}
      else if(a==='req'){if(st.rq>0){addEvent('req',st.rq,'');toast(st.rq+'本を発注しました');st.rq=0;}}
      else if(a==='sq'){st.qty=v==='0'?0:Math.max(0,st.qty+parseInt(v,10));}
      else if(a==='aq'){st.aq=v==='0'?0:Math.max(0,st.aq+parseInt(v,10));}
      else if(a==='sign'){st.sign=parseInt(v,10);}
      else if(a==='reason'){st.reason=v;st.sign=v==='ロス'?-1:v==='持越し'?1:st.sign;}
      else if(a==='mode'){st.mode=v;}
      else if(a==='ship'){if(st.qty>0){addEvent('ship',st.qty,'');events.forEach(function(e){if(e.day===st.day&&e.kind==='req'&&e.reason!=='done'){e.reason='done';doneL[e.id]=Date.now();send({op:'stockdone',id:e.id});}});toast(st.qty+'本の出荷を記録しました');st.qty=0;}}
      else if(a==='adj'){if(st.aq>0){addEvent('adjust',st.sign*st.aq,st.reason);toast('調整を記録しました');st.aq=0;}}
      else if(a==='actual'){
        var inp=document.getElementById('st-actual'),n=inp?parseInt(inp.value,10):NaN;
        if(!(n>=0)){toast('数えた本数を入れてください');}
        else{st.actual='';var c=stockCalc(st.day,list,done,events),d=n-c.stock;if(d===0)toast('差はありません');else{addEvent('adjust',d,'数え直し');toast('在庫を '+n+'本にそろえました');}}
      }
      else if(a==='void'){
        if(st.confirm===t.dataset.id){events=events.filter(function(e){return e.id!==t.dataset.id;});delete local[t.dataset.id];gone[t.dataset.id]=Date.now();lastAct=Date.now();send({op:'stockvoid',id:t.dataset.id});st.confirm=null;toast('取り消しました');}
        else{st.confirm=t.dataset.id;var cid=st.confirm;setTimeout(function(){if(st.confirm===cid){st.confirm=null;draw(true);}},3000);}
      }

    document.addEventListener('input',function(ev){if(ev.target&&ev.target.id==='st-actual')st.actual=ev.target.value;});
    document.addEventListener('change',function(ev){
      if(ev.target&&ev.target.id==='st-low'){addEvent('cfg',Math.max(0,parseInt(ev.target.value,10)||0),'','*');toast('目安を保存しました（全端末共通）');setTimeout(function(){draw(true);},0);}
    });
    function poll(){
      if(!BOARD_URL||document.hidden||bq.length||Date.now()-lastAct<6000)return;
      fetch(BOARD_URL+(BOARD_URL.indexOf('?')<0?'?':'&')+'t='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(j){
        list=j.orders||[];done=j.served||[];last=Date.now();
        if(!Array.isArray(j.stock)){st.noStock=true;}
        else{
          st.noStock=false;
          var ids={},nowT=Date.now();j.stock.forEach(function(e){ids[e.id]=1;});
          Object.keys(local).forEach(function(id){if(ids[id]||nowT-local[id].ts>180000)delete local[id];});
          Object.keys(gone).forEach(function(id){if(!ids[id]||nowT-gone[id]>180000)delete gone[id];});
          events=j.stock.filter(function(e){return !gone[e.id];}).concat(Object.keys(local).map(function(id){return local[id];}));
          events.forEach(function(e){if(doneL[e.id]){if(e.reason==='done'||nowT-doneL[e.id]>180000)delete doneL[e.id];else e.reason='done';}});
        }
        draw();
      }).catch(function(){draw();});
    }
    document.addEventListener('visibilitychange',function(){if(!document.hidden)poll();});
    drawNav();draw(true);poll();setInterval(poll,5000);setInterval(draw,10000);
  }

  /* ---------- 調理担当の閲覧画面（?view=cook） ---------- */
  function startCook(){
    var nav=document.getElementById('tabs');
    var ctab=IS_CANAL?1:0;
    function drawTabs(){
      if(!nav)return;
      nav.style.gridTemplateColumns='repeat(2,1fr)';
      nav.innerHTML='<button type="button" data-ctab="0"'+(ctab===0?' aria-current="true"':'')+'>調理状況</button><button type="button" data-ctab="1"'+(ctab===1?' aria-current="true"':'')+'>カナル調理スタッフ用</button>';
    }
    if(nav)nav.style.display='none';
    var h1=document.querySelector('header h1');if(h1)h1.textContent=IS_PICKUP?'理大祭・受け渡し':IS_CANAL?'理大祭・カナル':'理大祭・調理状況';
    if(IS_PICKUP)loadBq();
    var lastAct=0;
    var chip=document.getElementById('status');
    var list=[],done=[],events=[],last=0,failed=false;
    function draw(){
      var v=document.getElementById('view');
      var now=Date.now(),stale=!last||now-last>20000;
      if(chip){chip.textContent=stale?'通信待ち':'更新 '+new Date(last).toLocaleTimeString('ja-JP');chip.className='chip'+(stale?' warn':'');}
      var by={},names=[];
      list.forEach(function(o){(o.items||[]).forEach(function(it){if(!by[it.name]){by[it.name]=0;names.push(it.name);}by[it.name]+=it.qty;});});
      var h='<section>';
      if(IS_PICKUP&&bq.length)h+='<div class="card" style="border-color:var(--tomato)"><b>送信待ち '+bq.length+'件</b><div class="note" style="margin:4px 0 0">電波がつながると自動で送られます。</div></div>';
      if(!BOARD_URL)h+='<div class="card"><b>同期先が設定されていません。</b></div>';
      else if(stale)h+='<div class="card" style="border-color:var(--tomato)"><b>通信が途絶えています。</b><div class="note" style="margin:4px 0 0">'+(last?'最後に更新できた時刻：'+new Date(last).toLocaleTimeString('ja-JP')+'。':'まだ読み込めていません。')+'電波の良い場所に移動するか、ページを再読み込みしてください。表示は古い可能性があります。</div></div>';
      if(!IS_PICKUP&&ctab===1){
        var tday=DAYS.some(function(d){return d.key===jstToday();})?jstToday():'',sv={},sn=[];
        list.concat(done).forEach(function(o){(o.items||[]).forEach(function(it){if(sv[it.name]==null){sv[it.name]=0;sn.push(it.name);}});});
        done.forEach(function(o){if(tday&&o.day!==tday)return;(o.items||[]).forEach(function(it){sv[it.name]+=it.qty;});});
        h+=stockCard(stockCalc(ui.day,list,done,events),ui.day,events);
        h+='<div class="card board-sum" style="background:#e9f3ea;border-color:#9cc9a6"><h2>出た数（提供済みの合計・'+(tday?'本日 '+dayLabel(tday):'全日')+'）</h2>';
        if(!sn.length)h+='<div class="empty">まだありません</div>';
        sn.forEach(function(n){h+='<div class="cook" style="border-bottom-color:#9cc9a6"><span>'+esc(n)+'</span><b class="num" style="color:var(--good)">'+sv[n]+'<small>'+unitFor(n)+'</small></b></div>';});
        h+='</div>';
      }
      h+='<div class="card board-sum"><h2>いま作る数（作成中の合計）</h2>';
      if(!names.length)h+='<div class="empty">作成中のご注文はありません</div>';
      names.forEach(function(n){h+='<div class="cook"><span>'+esc(n)+'</span><b class="num">'+by[n]+'<small>'+unitFor(n)+'</small></b></div>';});
      h+='</div><div class="card"><h2>作成中 '+list.length+'件（古い順）</h2><div style="display:flex;flex-direction:column;gap:10px">';
      if(!list.length)h+='<div class="empty">なし</div>';
      list.forEach(function(o){
        var m=Math.max(0,Math.floor((now-o.ts)/60000));
        h+='<div class="tk making'+(m>=10?' late':'')+'"><div class="no num"><small>'+(o.ticket?'整理番号':'会計')+'</small>'+(o.ticket?esc(o.ticket):timeStr(o.ts))+'</div><div class="info"><b>'+boardText(o)+'</b><div class="sub">'+m+'分経過</div></div>'+(IS_PICKUP?'<button type="button" class="btn" data-act="pserve" data-id="'+esc(o.id)+'">提供済み</button>':'')+'</div>';
      });
      h+='</div></div>';
      h+='<div class="card"><h2>完了（提供済み '+done.length+'件・新しい順）</h2><div style="display:flex;flex-direction:column;gap:8px">';
      if(!done.length)h+='<div class="empty">なし</div>';
      done.forEach(function(o){
        h+='<div class="tk served"><div class="no num"><small>'+(o.ticket?'整理番号':'会計')+'</small>'+(o.ticket?esc(o.ticket):timeStr(o.ts))+'</div><div class="info"><b>'+boardText(o)+'</b><div class="sub">✓ 完了 '+(o.servedAt?timeStr(o.servedAt):'')+'</div></div>'+(IS_PICKUP?'<button type="button" class="btn ghost" data-act="punserve" data-id="'+esc(o.id)+'">作成中に戻す</button>':'')+'</div>';
      });
      v.innerHTML=h+'</div></div></section>';
    }
    function poll(){
      if(!BOARD_URL||document.hidden||bq.length||Date.now()-lastAct<6000)return;
      fetch(BOARD_URL+(BOARD_URL.indexOf('?')<0?'?':'&')+'t='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();}).then(function(j){
        events=j.stock||[];list=(j.orders||[]).slice().sort(function(a,b){return a.ts-b.ts;});done=(j.served||[]).slice().sort(function(a,b){return (b.servedAt||b.ts)-(a.servedAt||a.ts);});last=Date.now();failed=false;draw();
      }).catch(function(){failed=true;draw();});
    }
    function act(id,st){
      var o=list.concat(done).filter(function(x){return x.id===id;})[0];if(!o)return;
      var no=Object.assign({},o,{status:st,servedAt:st==='served'?Date.now():null});
      list=list.filter(function(x){return x.id!==id;});done=done.filter(function(x){return x.id!==id;});
      if(st==='served'){done.unshift(no);}else{list.push(no);list.sort(function(a,b){return a.ts-b.ts;});}
      lastAct=Date.now();draw();boardPush({op:'upsert',order:no});
    }
    document.addEventListener('click',function(ev){
      var t=ev.target.closest('[data-act="pserve"],[data-act="punserve"]');if(!t)return;
      act(t.dataset.id,t.dataset.act==='pserve'?'served':'making');
    });
    document.addEventListener('click',function(ev){
      var t=ev.target.closest('[data-ctab]');if(!t)return;
      ctab=+t.dataset.ctab;drawTabs();draw();window.scrollTo(0,0);var vw=document.getElementById('view');if(vw)vw.scrollTop=0;
    });
    document.addEventListener('visibilitychange',function(){if(!document.hidden)poll();});
    draw();poll();setInterval(poll,5000);setInterval(draw,10000);
  }

  /* ---------- boot ---------- */
  if(IS_STOCK){startStock();return;}
  if(IS_COOK){startCook();return;}
  loadBq();
  loadOutbox();
  render();
  start(localBackend());
  flush();
  flushBoard();
})();
</script>
</body>
</html>
